services:
  - type: web
    name: finanzapp
    runtime: static
    repo: https://github.com/jorgepnt-design/finanzapp
    branch: feat/finanzblick-v1
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
